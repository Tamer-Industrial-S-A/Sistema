
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMER INDUSTRIAL S.A. - ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script>
        // Polyfill global para evitar errores de librerías que esperan Node.js
        window.process = { 
            env: { NODE_ENV: 'production' },
            nextTick: (cb) => setTimeout(cb, 0)
        };
        window.global = window;

        // Registro de diagnóstico inicial
        console.log("HTML: Inicializando entorno de sistema TAMER...");

        function displayCriticalError(title, msg) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `
                    <div style="background: #1e293b; color: #f87171; padding: 40px; font-family: system-ui, sans-serif; border-radius: 20px; margin: 20px; border: 2px solid #ef4444; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); max-width: 600px;">
                        <h1 style="color: white; margin-bottom: 10px; font-size: 24px;">⚠️ Error de Sistema</h1>
                        <p style="color: #94a3b8; margin-bottom: 20px;">No se pudo cargar el motor de la aplicación debido a un error de módulos.</p>
                        <div style="background: #0f172a; padding: 20px; border-radius: 12px; font-family: monospace; font-size: 13px; color: #fca5a5; overflow: auto; border: 1px solid #334155; line-height: 1.5;">
                            <strong style="color: #ef4444;">${title}:</strong><br>${msg}
                        </div>
                        <button onclick="location.reload()" style="margin-top: 30px; background: #3b82f6; color: white; border: none; padding: 15px 30px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em;">
                            Reiniciar y Reintentar Carga
                        </button>
                    </div>
                `;
                root.style.display = 'flex';
                root.style.alignItems = 'center';
                root.style.justifyContent = 'center';
                root.style.background = '#0f172a';
            }
        }

        // Captura errores de red (404 en scripts) y de sintaxis en módulos
        window.addEventListener('error', function(e) {
            console.error("Error detectado:", e);
            const message = e.message || (e.target && e.target.src ? "Fallo al cargar script: " + e.target.src : "Error desconocido");
            displayCriticalError("Fallo de Carga/Ejecución", message);
        }, true);
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@0.2.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.46.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <style>
        body { margin: 0; background-color: #0f172a; height: 100vh; width: 100vw; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        
        /* Estado de carga inicial (Pantalla Azul) */
        #root:empty {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            flex-direction: column;
        }
        #root:empty::before {
            content: "";
            width: 50px;
            height: 50px;
            border: 5px solid rgba(59, 130, 246, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 25px;
        }
        #root:empty::after {
            content: "CARGANDO SISTEMA TAMER...";
            color: #60a5fa;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 900;
            letter-spacing: 0.5em;
            font-size: 0.7rem;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            text-transform: uppercase;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
