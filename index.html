<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMER INDUSTRIAL</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family:'Inter',sans-serif; overflow:hidden; }
.window { position:absolute; }
</style>
</head>

<body class="bg-slate-900 text-white">

<div class="flex h-screen">

<div class="w-60 bg-slate-950 p-5">
    <h1 class="text-xl font-bold mb-6">TAMER SYSTEM</h1>
    <button onclick="openWindow('AUTOMATIZACION')" class="w-full mb-3 p-3 bg-slate-800 rounded-xl">AUTOMATIZACIÓN</button>
    <button onclick="openWindow('CONFIGURACION')" class="w-full mb-3 p-3 bg-slate-800 rounded-xl">CONFIGURACIÓN</button>
</div>

<div id="desktop" class="flex-1 relative"></div>
</div>

<script>

/* =========================
   ESTADO
========================= */

const STATE = {
    tables:{
        MATERIALES:[],
        CLIENTES:[],
        ORD_FABRICACIONES:[],
        ORD_TRABAJOS:[]
    },
    cotizacion:{
        cliente:null,
        of:null,
        ot:null,
        items:[]
    }
};

function save(){ localStorage.setItem("APP_STATE",JSON.stringify(STATE)); }
function load(){
    const d=localStorage.getItem("APP_STATE");
    if(d) Object.assign(STATE,JSON.parse(d));
}
load();

/* =========================
   VALIDACION ENCABEZADOS
========================= */

const REQUIRED = {
    MATERIALES:["CODIGO","DESCRIPCION","PRECIO_UN"],
    CLIENTES:["COD_CLIENTE","RAZON_SOCIAL"],   // <-- MODIFICADO
    ORD_FABRICACIONES:["OF","DESCRIPCION_OF","COD_CLIENTE"],
    ORD_TRABAJOS:["OT","DESCRIPCION_OT","OFABRICACIONES"]
};

function validarEstructura(json,tabla){
    const headers=Object.keys(json[0]||{});
    return REQUIRED[tabla].every(h=>headers.includes(h));
}

/* =========================
   IMPORTAR EXCEL
========================= */

function importExcel(e,tabla){
    const file=e.target.files[0];
    const reader=new FileReader();

    reader.onload=function(evt){
        const wb=XLSX.read(evt.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{defval:""});

        if(!validarEstructura(json,tabla)){
            alert("Encabezados incorrectos para "+tabla);
            return;
        }

        STATE.tables[tabla]=json;
        save();
        alert(tabla+" cargado: "+json.length+" registros");
    };

    reader.readAsBinaryString(file);
}

/* =========================
   VENTANAS
========================= */

let z=1;
function openWindow(title){

    const win=document.createElement("div");
    win.className="window bg-slate-100 text-black rounded-2xl shadow-2xl w-[900px]";
    win.style.top="100px";
    win.style.left="200px";
    win.style.zIndex=z++;

    win.innerHTML=`
        <div class="bg-slate-800 text-white p-3 rounded-t-2xl cursor-move flex justify-between">
            <span>${title}</span>
            <button onclick="this.closest('.window').remove()">✖</button>
        </div>
        <div class="p-6 h-[600px] overflow-auto content-area">
            ${renderContent(title)}
        </div>
    `;

    makeDraggable(win);
    document.getElementById("desktop").appendChild(win);
}

/* =========================
   CONTENIDO
========================= */

function renderContent(title){

    if(title==="CONFIGURACION"){
        return `
        <h2 class="text-xl font-bold mb-4">Carga de Excel</h2>
        ${loader("MATERIALES")}
        ${loader("CLIENTES")}
        ${loader("ORD_FABRICACIONES")}
        ${loader("ORD_TRABAJOS")}
        `;
    }

    if(title==="AUTOMATIZACION"){
        return renderCotizacion();
    }
}

function loader(tabla){
    return `
    <div class="mb-4">
        <label class="font-semibold">${tabla}</label>
        <input type="file" accept=".xlsx"
        onchange="importExcel(event,'${tabla}')"
        class="border p-2 rounded w-full">
    </div>`;
}

/* =========================
   COTIZACION RELACIONAL
========================= */

function renderCotizacion(){

    if(STATE.tables.CLIENTES.length===0)
        return "<p class='text-red-600'>Debe cargar CLIENTES primero.</p>";

    const clientes=STATE.tables.CLIENTES;

    const ofs=STATE.tables.ORD_FABRICACIONES.filter(of=>
        of.COD_CLIENTE===STATE.cotizacion.cliente
    );

    const ots=STATE.tables.ORD_TRABAJOS.filter(ot=>
        ot.OFABRICACIONES===STATE.cotizacion.of
    );

    return `
    <h2 class="text-xl font-bold mb-4">Cotización</h2>

    <div class="grid grid-cols-3 gap-4 mb-4">

        <select onchange="selectCliente(this.value)"
        class="border p-2 rounded">
        <option value="">Seleccionar Cliente</option>
        ${clientes.map(c=>
            `<option value="${c.COD_CLIENTE}">
            ${c.COD_CLIENTE} - ${c.RAZON_SOCIAL}
            </option>`
        ).join("")}
        </select>

        <select onchange="selectOF(this.value)"
        class="border p-2 rounded">
        <option value="">Seleccionar OF</option>
        ${ofs.map(of=>
            `<option value="${of.OF}">
            ${of.OF} - ${of.DESCRIPCION_OF}
            </option>`
        ).join("")}
        </select>

        <select onchange="selectOT(this.value)"
        class="border p-2 rounded">
        <option value="">Seleccionar OT</option>
        ${ots.map(ot=>
            `<option value="${ot.OT}">
            ${ot.OT} - ${ot.DESCRIPCION_OT}
            </option>`
        ).join("")}
        </select>

    </div>

    ${renderMateriales()}
    ${renderTablaItems()}
    `;
}

/* =========================
   SELECCIONES
========================= */

function selectCliente(val){
    STATE.cotizacion.cliente=val;
    STATE.cotizacion.of=null;
    STATE.cotizacion.ot=null;
    refresh();
}

function selectOF(val){
    STATE.cotizacion.of=val;
    STATE.cotizacion.ot=null;
    refresh();
}

function selectOT(val){
    STATE.cotizacion.ot=val;
    refresh();
}

/* =========================
   MATERIALES
========================= */

function renderMateriales(){

    if(STATE.tables.MATERIALES.length===0)
        return "<p class='text-red-600'>Debe cargar MATERIALES.</p>";

    return `
    <div class="flex gap-2 mb-4">
        <select id="matSel" class="border p-2 rounded w-full">
            ${STATE.tables.MATERIALES.map((m,i)=>
                `<option value="${i}">
                ${m.CODIGO} - ${m.DESCRIPCION}
                </option>`
            ).join("")}
        </select>

        <input id="cant" type="number"
        placeholder="Cant"
        class="border p-2 rounded w-24">

        <button onclick="agregarItem()"
        class="bg-slate-800 text-white px-4 rounded">
        Agregar
        </button>
    </div>`;
}

function agregarItem(){

    const i=document.getElementById("matSel").value;
    const cant=parseFloat(document.getElementById("cant").value)||0;
    const m=STATE.tables.MATERIALES[i];

    STATE.cotizacion.items.push({
        CODIGO:m.CODIGO,
        DESCRIPCION:m.DESCRIPCION,
        PRECIO:m.PRECIO_UN,
        CANT:cant,
        TOTAL:(m.PRECIO_UN*cant).toFixed(2)
    });

    save();
    refresh();
}

/* =========================
   TABLA ITEMS
========================= */

function renderTablaItems(){

    return `
    <table class="w-full bg-white text-sm mt-4">
        <thead class="bg-slate-200">
            <tr>
                <th>CODIGO</th>
                <th>DESCRIPCION</th>
                <th>PRECIO</th>
                <th>CANT</th>
                <th>TOTAL</th>
            </tr>
        </thead>
        <tbody>
        ${STATE.cotizacion.items.map(i=>`
            <tr>
                <td>${i.CODIGO}</td>
                <td>${i.DESCRIPCION}</td>
                <td>${i.PRECIO}</td>
                <td>${i.CANT}</td>
                <td>${i.TOTAL}</td>
            </tr>
        `).join("")}
        </tbody>
    </table>

    <div class="text-right mt-4 font-bold">
        TOTAL GENERAL:
        ${STATE.cotizacion.items
            .reduce((s,i)=>s+parseFloat(i.TOTAL),0)
            .toFixed(2)}
    </div>`;
}

/* =========================
   REFRESH
========================= */

function refresh(){
    document.querySelector(".content-area").innerHTML=
        renderCotizacion();
}

/* =========================
   DRAG
========================= */

function makeDraggable(el){
    const header=el.querySelector(".cursor-move");
    let x=0,y=0;

    header.onmousedown=function(e){
        x=e.clientX-el.offsetLeft;
        y=e.clientY-el.offsetTop;

        document.onmousemove=function(e){
            el.style.left=(e.clientX-x)+"px";
            el.style.top=(e.clientY-y)+"px";
        }

        document.onmouseup=function(){
            document.onmousemove=null;
        }
    }
}

</script>
</body>
</html>
