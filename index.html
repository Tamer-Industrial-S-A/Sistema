<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMER INDUSTRIAL S.A. - ERP</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; }
</style>
</head>

<body class="bg-slate-50">
<div id="app"></div>

<script>

/* =============================
   ESTADO GLOBAL
============================= */

const STATE = {
    user: null,
    currentRoute: "dashboard",
    tables: {
        MATERIALES: [],
        CLIENTES: [],
        ORD_FABRICACIONES: [],
        ORD_TRABAJOS: []
    }
};

let currentChart = null;

/* =============================
   STORAGE
============================= */

function saveState() {
    localStorage.setItem("ERP_TABLES", JSON.stringify(STATE.tables));
}

function loadState() {
    const data = localStorage.getItem("ERP_TABLES");
    if (data) STATE.tables = JSON.parse(data);
}

/* =============================
   LOGIN
============================= */

function renderLogin() {
    document.getElementById("app").innerHTML = `
    <div class="h-screen flex items-center justify-center bg-slate-100">
        <div class="bg-white p-10 rounded-3xl shadow-xl w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">TAMER INDUSTRIAL S.A.</h2>
            <input id="user" placeholder="Usuario" class="w-full p-3 mb-4 border rounded-xl">
            <input id="pass" type="password" placeholder="Contraseña" class="w-full p-3 mb-6 border rounded-xl">
            <button onclick="login()" class="w-full bg-slate-900 text-white p-3 rounded-xl shadow">Ingresar</button>
        </div>
    </div>`;
}

function login() {
    const user = document.getElementById("user").value;
    const pass = document.getElementById("pass").value;
    if (user === "admin" && pass === "123") {
        localStorage.setItem("ERP_USER", "admin");
        init();
    } else alert("Credenciales incorrectas");
}

function logout(){
    localStorage.removeItem("ERP_USER");
    location.reload();
}

/* =============================
   LAYOUT
============================= */

function renderLayout(content) {
    document.getElementById("app").innerHTML = `
    <div class="flex h-screen">
        <aside class="bg-slate-950 text-white w-64 p-6 hidden md:block">
            <h1 class="text-xl font-bold mb-8">ERP TAMER</h1>
            ${navBtn("dashboard","Dashboard")}
            ${navBtn("MATERIALES","Materiales")}
            ${navBtn("CLIENTES","Clientes")}
            ${navBtn("ORD_FABRICACIONES","Fabricaciones")}
            ${navBtn("ORD_TRABAJOS","Trabajos")}
            <button onclick="logout()" class="mt-8 text-red-400">Salir</button>
        </aside>
        <main class="flex-1 p-8 overflow-auto">${content}</main>
    </div>`;
    lucide.createIcons();
}

function navBtn(route,label){
    return `<button onclick="navigate('${route}')"
        class="w-full p-3 mb-2 rounded-xl hover:bg-slate-800 text-left">
        ${label}
    </button>`;
}

function navigate(route){
    STATE.currentRoute = route;
    render();
}

/* =============================
   DASHBOARD
============================= */

function renderDashboard(){
    return `
    <h2 class="text-3xl font-bold mb-6">Dashboard</h2>
    <div class="grid md:grid-cols-4 gap-6 mb-10">
        ${card("Materiales",STATE.tables.MATERIALES.length)}
        ${card("Clientes",STATE.tables.CLIENTES.length)}
        ${card("Fabricaciones",STATE.tables.ORD_FABRICACIONES.length)}
        ${card("Trabajos",STATE.tables.ORD_TRABAJOS.length)}
    </div>
    <div class="bg-white p-6 rounded-3xl shadow">
        <canvas id="chart"></canvas>
    </div>`;
}

function card(title,val){
    return `<div class="bg-white p-6 rounded-3xl shadow text-center">
        <h3>${title}</h3>
        <p class="text-3xl font-bold">${val}</p>
    </div>`;
}

function renderChart(){
    if(currentChart) currentChart.destroy();

    const data = STATE.tables.MATERIALES.slice(0,10);
    const labels = data.map((m,i)=>m.nombre || "Mat"+(i+1));
    const stock = data.map(m=>parseFloat(m.stock)||0);

    currentChart = new Chart(document.getElementById("chart"),{
        type:"bar",
        data:{labels,datasets:[{label:"Stock",data:stock}]}
    });
}

/* =============================
   TABLAS
============================= */

function renderTable(name){
    const data = STATE.tables[name];
    const headers = getHeaders(data);

    return `
    <h2 class="text-2xl font-bold mb-4">${name}</h2>
    <div class="mb-4 flex gap-4">
        <button onclick="addRow('${name}')" class="bg-slate-900 text-white px-4 py-2 rounded-xl shadow">Agregar</button>
        <button onclick="exportExcel('${name}')" class="bg-green-600 text-white px-4 py-2 rounded-xl shadow">Exportar</button>
        <input type="file" accept=".xlsx,.xls" onchange="importExcel(event,'${name}')">
    </div>

    <div class="bg-white rounded-3xl shadow overflow-auto">
    <table class="w-full text-sm">
        <thead class="bg-slate-200">
            <tr>
            ${headers.map(h=>`<th class="p-3">${h}</th>`).join("")}
            <th></th>
            </tr>
        </thead>
        <tbody>
        ${data.map((row,i)=>`
            <tr class="border-t">
            ${headers.map(h=>`
                <td contenteditable
                onblur="updateCell('${name}',${i},'${h}',this.innerText)"
                class="p-3">${row[h]||""}</td>`).join("")}
            <td><button onclick="deleteRow('${name}',${i})">❌</button></td>
            </tr>`).join("")}
        </tbody>
    </table>
    </div>`;
}

function getHeaders(data){
    const headers = new Set();
    data.forEach(row=>Object.keys(row).forEach(k=>headers.add(k)));
    return headers.size ? Array.from(headers) : ["columna1","columna2"];
}

function addRow(name){
    const headers = getHeaders(STATE.tables[name]);
    const newRow = {};
    headers.forEach(h=>newRow[h]="");
    STATE.tables[name].push(newRow);
    saveState();
    render();
}

function deleteRow(name,i){
    STATE.tables[name].splice(i,1);
    saveState();
    render();
}

function updateCell(name,i,key,val){
    STATE.tables[name][i][key]=val;
    saveState();
}

/* =============================
   EXCEL FUNCIONAL
============================= */

function importExcel(e,name){
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(evt){
        const workbook = XLSX.read(evt.target.result,{type:'binary'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet,{defval:""});

        STATE.tables[name] = json;
        saveState();
        render();
    };

    reader.readAsBinaryString(file);
}

function exportExcel(name){
    const ws = XLSX.utils.json_to_sheet(STATE.tables[name]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,name);
    XLSX.writeFile(wb, name+".xlsx");
}

/* =============================
   RENDER
============================= */

function render(){
    if(STATE.currentRoute==="dashboard"){
        renderLayout(renderDashboard());
        setTimeout(renderChart,100);
    } else {
        renderLayout(renderTable(STATE.currentRoute));
    }
}

/* =============================
   INIT
============================= */

function init(){
    loadState();
    STATE.user = localStorage.getItem("ERP_USER");
    if(!STATE.user) renderLogin();
    else render();
}

init();

</script>
</body>
</html>
