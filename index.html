
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial ERP - TAMER INDUSTRIAL S.A.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script>
        // Polyfill para process.env
        window.process = { env: { NODE_ENV: 'production' } };
        
        // Capturador de errores antes de que cargue React
        window.addEventListener('error', function(e) {
            const root = document.getElementById('root');
            if (root) {
                root.style.display = 'block';
                root.innerHTML = `
                    <div style="background: #7f1d1d; color: white; padding: 20px; font-family: sans-serif; border-radius: 10px; margin: 20px; border: 2px solid #ef4444;">
                        <h2 style="margin:0 0 10px 0">❌ Error Crítico de Carga</h2>
                        <p style="font-size: 14px; margin:0">Fallo en: ${e.filename || 'Script desconocido'}</p>
                        <p style="font-size: 12px; opacity: 0.8; margin-top: 10px">${e.message}</p>
                        <button onclick="location.reload()" style="margin-top: 15px; background: white; color: #7f1d1d; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: bold;">Reintentar</button>
                    </div>
                `;
            }
        });
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "recharts": "https://esm.sh/recharts@3.0.0",
    "@google/genai": "https://esm.sh/@google/genai@0.2.1",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.46.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<style>
    body { margin: 0; background-color: #0f172a; }
    #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 20px;
        color: white;
        font-family: sans-serif;
    }
    #root:empty::after {
        content: "CARGANDO SISTEMA TAMER...";
        font-weight: 900;
        letter-spacing: 0.2em;
        font-size: 0.75rem;
        color: #3b82f6;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
