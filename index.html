<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMER INDUSTRIAL - Sistema</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; overflow:hidden; }
.window { position:absolute; }
</style>
</head>

<body class="bg-slate-900 text-white">

<div class="flex h-screen">

<!-- Sidebar -->
<div class="w-60 bg-slate-950 p-5">
    <h1 class="text-xl font-bold mb-6">TAMER SYSTEM</h1>
    <button onclick="openWindow('AUTOMATIZACION')" class="w-full mb-3 p-3 bg-slate-800 rounded-xl">AUTOMATIZACIÓN</button>
    <button onclick="openWindow('COMPRAS')" class="w-full mb-3 p-3 bg-slate-800 rounded-xl">COMPRAS</button>
    <button onclick="openWindow('PROYECTO')" class="w-full mb-3 p-3 bg-slate-800 rounded-xl">PROYECTO</button>
    <button onclick="openWindow('CONFIGURACION')" class="w-full mb-3 p-3 bg-slate-800 rounded-xl">CONFIGURACIÓN</button>
</div>

<div id="desktop" class="flex-1 relative"></div>

</div>

<script>

/* ===============================
   ESTADO GLOBAL
================================*/

const STATE = {
    tables:{
        MATERIALES:[],
        CLIENTES:[],
        ORD_FABRICACIONES:[],
        ORD_TRABAJOS:[]
    },
    cotizacion:[]
};

function saveState(){
    localStorage.setItem("APP_STATE", JSON.stringify(STATE));
}

function loadState(){
    const data = localStorage.getItem("APP_STATE");
    if(data) Object.assign(STATE, JSON.parse(data));
}

loadState();

/* ===============================
   SISTEMA DE VENTANAS
================================*/

let zIndex = 1;

function openWindow(title){

    const win = document.createElement("div");
    win.className="window bg-slate-100 text-black rounded-2xl shadow-2xl w-[700px]";
    win.style.top="100px";
    win.style.left="200px";
    win.style.zIndex = zIndex++;

    win.innerHTML = `
        <div class="bg-slate-800 text-white p-3 rounded-t-2xl cursor-move flex justify-between">
            <span>${title}</span>
            <button onclick="this.closest('.window').remove()">✖</button>
        </div>
        <div class="p-6 h-[500px] overflow-auto">
            ${renderContent(title)}
        </div>
    `;

    makeDraggable(win);
    document.getElementById("desktop").appendChild(win);
}

/* ===============================
   CONTENIDO DE VENTANAS
================================*/

function renderContent(title){

    if(title==="CONFIGURACION"){
        return `
        <h2 class="text-xl font-bold mb-4">Cargar Archivos Excel</h2>
        ${excelLoader("MATERIALES")}
        ${excelLoader("CLIENTES")}
        ${excelLoader("ORD_FABRICACIONES")}
        ${excelLoader("ORD_TRABAJOS")}
        `;
    }

    if(title==="AUTOMATIZACION"){
        return renderCotizacion();
    }

    if(title==="COMPRAS"){
        return "<h2 class='text-xl font-bold'>Módulo Compras</h2>";
    }

    if(title==="PROYECTO"){
        return "<h2 class='text-xl font-bold'>Módulo Proyecto</h2>";
    }

}

/* ===============================
   CONFIGURACION - EXCEL
================================*/

function excelLoader(name){
    return `
    <div class="mb-4">
        <label class="block mb-1 font-semibold">${name}</label>
        <input type="file" accept=".xlsx,.xls"
        onchange="importExcel(event,'${name}')"
        class="border p-2 rounded w-full">
    </div>`;
}

function importExcel(e,name){
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(evt){
        const wb = XLSX.read(evt.target.result,{type:'binary'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws,{defval:""});
        STATE.tables[name] = json;
        saveState();
        alert(name+" cargado correctamente");
    };

    reader.readAsBinaryString(file);
}

/* ===============================
   AUTOMATIZACION - COTIZACIONES
================================*/

function renderCotizacion(){

    return `
    <h2 class="text-xl font-bold mb-4">Crear Cotización</h2>

    <div class="flex gap-2 mb-4">
        <select id="materialSelect" class="border p-2 rounded w-full">
            ${STATE.tables.MATERIALES.map((m,i)=>
                `<option value="${i}">
                ${m.codigo || ""} - ${m.descripcion || ""}
                </option>`
            ).join("")}
        </select>
        <input id="cantidad" type="number" placeholder="Cant"
        class="border p-2 rounded w-24">
        <button onclick="agregarMaterial()"
        class="bg-slate-800 text-white px-4 rounded">
        Agregar
        </button>
    </div>

    <table class="w-full text-sm bg-white">
        <thead class="bg-slate-200">
            <tr>
                <th>Codigo</th>
                <th>Descripcion</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
        ${STATE.cotizacion.map(item=>`
            <tr>
                <td>${item.codigo}</td>
                <td>${item.descripcion}</td>
                <td>${item.precio}</td>
                <td>${item.cantidad}</td>
                <td>${item.total}</td>
            </tr>
        `).join("")}
        </tbody>
    </table>

    <div class="text-right mt-4 font-bold text-lg">
        TOTAL: ${calcularTotal()}
    </div>
    `;
}

function agregarMaterial(){
    const index = document.getElementById("materialSelect").value;
    const cantidad = parseFloat(document.getElementById("cantidad").value);

    const mat = STATE.tables.MATERIALES[index];
    const precio = parseFloat(mat.precio_un || 0);

    const item = {
        codigo: mat.codigo || "",
        descripcion: mat.descripcion || "",
        precio: precio,
        cantidad: cantidad,
        total: precio * cantidad
    };

    STATE.cotizacion.push(item);
    saveState();
    document.querySelector(".window .p-6").innerHTML = renderCotizacion();
}

function calcularTotal(){
    return STATE.cotizacion
    .reduce((sum,i)=>sum+i.total,0)
    .toFixed(2);
}

/* ===============================
   DRAG WINDOWS
================================*/

function makeDraggable(el){
    const header = el.querySelector(".cursor-move");
    let offsetX=0, offsetY=0;

    header.onmousedown = function(e){
        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;

        document.onmousemove = function(e){
            el.style.left = (e.clientX - offsetX)+"px";
            el.style.top = (e.clientY - offsetY)+"px";
        }

        document.onmouseup = function(){
            document.onmousemove=null;
        }
    }
}

</script>

</body>
</html>
