<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMER INDUSTRIAL ERP</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{overflow:hidden}
.window{position:absolute}
.titlebar{cursor:move}
.tab-active{background:#1e293b;color:white}
</style>
</head>

<body class="bg-slate-900 text-white">

<div id="desktop" class="w-screen h-screen relative"></div>

<div class="absolute bottom-0 left-0 right-0 bg-slate-800 h-12 flex items-center px-4 gap-4">
<button onclick="openWindow('AUTOMATIZACION')" class="bg-slate-700 px-3 py-1 rounded">AUTOMATIZACION</button>
<button onclick="openWindow('CONFIGURACION')" class="bg-slate-700 px-3 py-1 rounded">CONFIGURACION</button>
</div>

<script>

/* ========================
   ESTADO GLOBAL
======================== */

const TABLES=["MATERIALES","CLIENTES","ORD_FABRICACIONES","ORD_TRABAJOS"];
const STATE={};
TABLES.forEach(t=>{
STATE[t]={headers:[],rows:[],visible:[]};
});

function saveState(){
localStorage.setItem("ERP_STATE",JSON.stringify(STATE));
}
function loadState(){
const data=localStorage.getItem("ERP_STATE");
if(data) Object.assign(STATE,JSON.parse(data));
}
loadState();

/* ========================
   VENTANAS
======================== */

let zIndex=10;

function openWindow(title){
const win=document.createElement("div");
win.className="window bg-white text-black rounded-2xl shadow-xl w-[1100px] h-[700px] p-4";
win.style.top="60px";
win.style.left="120px";
win.style.zIndex=zIndex++;

win.innerHTML=`
<div class="titlebar bg-slate-200 p-2 rounded-t-xl flex justify-between items-center">
<span class="font-bold">${title}</span>
<button onclick="this.closest('.window').remove()" class="text-red-600 font-bold">X</button>
</div>
<div class="content h-[620px] overflow-auto p-2"></div>
`;

document.getElementById("desktop").appendChild(win);
makeDraggable(win);
renderContent(title,win.querySelector(".content"));
}

function makeDraggable(el){
const bar=el.querySelector(".titlebar");
bar.onmousedown=e=>{
const ox=e.clientX-el.offsetLeft;
const oy=e.clientY-el.offsetTop;
document.onmousemove=e=>{
el.style.left=(e.clientX-ox)+"px";
el.style.top=(e.clientY-oy)+"px";
};
document.onmouseup=()=>document.onmousemove=null;
};
}

/* ========================
   RENDER
======================== */

function renderContent(title,container){
if(title==="CONFIGURACION") renderConfig(container);
if(title==="AUTOMATIZACION") renderCotizador(container);
}

/* ========================
   CONFIGURACION
======================== */

function renderConfig(container){

container.innerHTML=`
<div class="flex gap-2 mb-4">
${TABLES.map(t=>`
<button onclick="renderTab('${t}')" 
id="tab-${t}" 
class="px-3 py-1 rounded bg-slate-300">
${t}
</button>
`).join("")}
</div>
<div id="tabContent"></div>
`;

renderTab(TABLES[0]);
}

function renderTab(tabla){

document.querySelectorAll("[id^='tab-']")
.forEach(b=>b.classList.remove("tab-active"));

document.getElementById("tab-"+tabla)
.classList.add("tab-active");

const container=document.getElementById("tabContent");

container.innerHTML=`
<button onclick="importExcel('${tabla}')" 
class="bg-blue-600 text-white px-3 py-1 rounded mb-3">
Importar Excel
</button>

<div id="checklist-${tabla}" class="mb-4"></div>
<div id="table-${tabla}"></div>
`;

renderChecklist(tabla);
renderTable(tabla);
}

/* ========================
   IMPORTADOR
======================== */

function importExcel(tabla){

const input=document.createElement("input");
input.type="file";
input.accept=".xlsx,.xls";

input.onchange=e=>{

const file=e.target.files[0];
const reader=new FileReader();

reader.onload=evt=>{

const data=new Uint8Array(evt.target.result);
const wb=XLSX.read(data,{type:"array"});
const sheet=wb.Sheets[wb.SheetNames[0]];

const rows=XLSX.utils.sheet_to_json(sheet,{
header:1,
defval:"",
blankrows:false
});

if(!rows || rows.length<2){
alert("Archivo sin datos");
return;
}

const headers=rows[0]
.map(h=>h.toString().trim())
.filter(h=>h!=="");

const dataRows=rows.slice(1)
.filter(r=>r.some(c=>c!==""))
.map(r=>{
let obj={};
headers.forEach((h,i)=>{
obj[h]=(r[i]!==undefined ? r[i] : "").toString().trim();
});
return obj;
});

STATE[tabla].headers=headers;
STATE[tabla].rows=dataRows;
STATE[tabla].visible=[...headers];

saveState();
renderTab(tabla);

alert("Importados "+dataRows.length+" registros");

};

reader.readAsArrayBuffer(file);
};

input.click();
}

/* ========================
   CHECKLIST
======================== */

function renderChecklist(tabla){

const div=document.getElementById("checklist-"+tabla);

if(STATE[tabla].headers.length===0){
div.innerHTML="";
return;
}

div.innerHTML=`
<h3 class="font-bold mb-2">Columnas visibles</h3>
<div class="grid grid-cols-3 gap-2">
${STATE[tabla].headers.map(h=>`
<label class="flex items-center gap-2">
<input type="checkbox"
${STATE[tabla].visible.includes(h)?"checked":""}
onchange="toggleColumn('${tabla}','${h}')">
<span>${h}</span>
</label>
`).join("")}
</div>
`;
}

function toggleColumn(tabla,col){

if(STATE[tabla].visible.includes(col)){
STATE[tabla].visible=
STATE[tabla].visible.filter(c=>c!==col);
}else{
STATE[tabla].visible.push(col);
}

saveState();
renderTable(tabla);
}

/* ========================
   TABLAS
======================== */

function renderTable(tabla){

const div=document.getElementById("table-"+tabla);

if(STATE[tabla].rows.length===0){
div.innerHTML="<p>Sin datos</p>";
return;
}

const headers=STATE[tabla].visible.length>0
?STATE[tabla].visible
:STATE[tabla].headers;

div.innerHTML=`
<table class="w-full text-xs border">
<tr>
${headers.map(h=>`<th class="border p-1 bg-gray-100">${h}</th>`).join("")}
</tr>
${STATE[tabla].rows.map(r=>`
<tr>
${headers.map(h=>`<td class="border p-1">${r[h]||""}</td>`).join("")}
</tr>
`).join("")}
</table>
`;
}

/* ========================
   COTIZADOR CON FILTRO
======================== */

let cotizacion=[];
let filtroTexto="";

function renderCotizador(container){

if(STATE.MATERIALES.rows.length===0){
container.innerHTML="<h2>No hay materiales cargados</h2>";
return;
}

const headers=STATE.MATERIALES.visible.length>0
?STATE.MATERIALES.visible
:STATE.MATERIALES.headers;

container.innerHTML=`
<h2 class="text-lg font-bold mb-3">Cotización</h2>

<input 
type="text" 
placeholder="Filtrar por código..." 
class="border p-1 mb-2 w-full"
oninput="filtrarMateriales(this.value)"
>

<select id="matSelect" class="border p-1 mb-2 w-full"></select>

<input id="cantidad" type="number" value="1" class="border p-1 w-20">

<button onclick="agregarItem()" 
class="bg-green-600 text-white px-3 py-1 rounded ml-2">
Agregar
</button>

<table class="w-full text-xs border mt-4">
<thead>
<tr>
${headers.map(h=>`<th class="border p-1 bg-gray-100">${h}</th>`).join("")}
<th class="border p-1 bg-gray-100">CANT</th>
<th class="border p-1 bg-gray-100">TOTAL</th>
</tr>
</thead>
<tbody id="cotBody"></tbody>
</table>

<h3 class="mt-3 font-bold">TOTAL: $<span id="total">0</span></h3>
`;

actualizarSelectMateriales();
}

function filtrarMateriales(texto){
filtroTexto=texto.toLowerCase();
actualizarSelectMateriales();
}

function actualizarSelectMateriales(){

const select=document.getElementById("matSelect");
select.innerHTML="";

STATE.MATERIALES.rows
.filter(m=>{
return Object.values(m)
.join(" ")
.toLowerCase()
.includes(filtroTexto);
})
.forEach((m,i)=>{
const option=document.createElement("option");
option.value=i;
option.text=Object.values(m).join(" - ");
select.appendChild(option);
});
}

function agregarItem(){

const select=document.getElementById("matSelect");
if(!select.value) return;

const mat=STATE.MATERIALES.rows[select.value];
const cant=parseFloat(document.getElementById("cantidad").value);

let precio=0;
if(mat["PRECIO_UN"]){
precio=parseFloat(mat["PRECIO_UN"]);
}else{
Object.values(mat).forEach(v=>{
if(!isNaN(parseFloat(v)) && precio===0)
precio=parseFloat(v);
});
}

const total=precio*cant;
cotizacion.push({mat,cant,total});
renderCotizacion();
}

function renderCotizacion(){

const body=document.getElementById("cotBody");
body.innerHTML="";
let suma=0;

cotizacion.forEach(i=>{
suma+=i.total;
body.innerHTML+=`
<tr>
${Object.values(i.mat).map(v=>`<td class="border p-1">${v}</td>`).join("")}
<td class="border p-1">${i.cant}</td>
<td class="border p-1">${i.total.toFixed(2)}</td>
</tr>
`;
});

document.getElementById("total").innerText=suma.toFixed(2);
}

</script>
</body>
</html>

</script>
</body>
</html>
