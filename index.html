<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMER INDUSTRIAL</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family:'Inter',sans-serif; overflow:hidden; }
.window { position:absolute; }
</style>
</head>

<body class="bg-slate-900 text-white">

<div class="flex h-screen">

<div class="w-60 bg-slate-950 p-5">
    <h1 class="text-xl font-bold mb-6">TAMER SYSTEM</h1>
    <button onclick="openWindow('AUTOMATIZACION')" class="w-full mb-3 p-3 bg-slate-800 rounded-xl">AUTOMATIZACIÓN</button>
    <button onclick="openWindow('CONFIGURACION')" class="w-full mb-3 p-3 bg-slate-800 rounded-xl">CONFIGURACIÓN</button>
</div>

<div id="desktop" class="flex-1 relative"></div>
</div>

<script>

/* =========================
   ESTADO
========================= */

const STATE = {
    tables:{
        MATERIALES:[],
        CLIENTES:[],
        ORD_FABRICACIONES:[],
        ORD_TRABAJOS:[]
    },
    cotizacion:[]
};

function saveState(){
    localStorage.setItem("APP_STATE",JSON.stringify(STATE));
}

function loadState(){
    const data = localStorage.getItem("APP_STATE");
    if(data) Object.assign(STATE,JSON.parse(data));
}

loadState();

/* =========================
   VENTANAS
========================= */

let z=1;

function openWindow(title){

    const win=document.createElement("div");
    win.className="window bg-slate-100 text-black rounded-2xl shadow-2xl w-[800px]";
    win.style.top="120px";
    win.style.left="250px";
    win.style.zIndex=z++;

    win.innerHTML=`
        <div class="bg-slate-800 text-white p-3 rounded-t-2xl cursor-move flex justify-between">
            <span>${title}</span>
            <button onclick="this.closest('.window').remove()">✖</button>
        </div>
        <div class="p-6 h-[500px] overflow-auto content-area">
            ${renderContent(title)}
        </div>
    `;

    makeDraggable(win);
    document.getElementById("desktop").appendChild(win);
}

/* =========================
   CONTENIDO
========================= */

function renderContent(title){

    if(title==="CONFIGURACION"){
        return `
        <h2 class="text-xl font-bold mb-4">Carga de Excel</h2>

        ${excelLoader("MATERIALES")}
        ${excelLoader("CLIENTES")}
        ${excelLoader("ORD_FABRICACIONES")}
        ${excelLoader("ORD_TRABAJOS")}

        <div class="mt-6 text-sm">
            <strong>Estado actual:</strong><br>
            Materiales: ${STATE.tables.MATERIALES.length}<br>
            Clientes: ${STATE.tables.CLIENTES.length}<br>
            Fabricaciones: ${STATE.tables.ORD_FABRICACIONES.length}<br>
            Trabajos: ${STATE.tables.ORD_TRABAJOS.length}
        </div>
        `;
    }

    if(title==="AUTOMATIZACION"){
        return renderCotizacion();
    }
}

/* =========================
   NORMALIZADOR ENCABEZADOS
========================= */

function normalizarFila(row){

    const nueva={};

    Object.keys(row).forEach(k=>{
        const key=k.toLowerCase().trim();

        if(key.includes("cod")) nueva.codigo=row[k];
        else if(key.includes("desc")) nueva.descripcion=row[k];
        else if(key.includes("precio")) nueva.precio_un=row[k];
        else nueva[key]=row[k];
    });

    return nueva;
}

/* =========================
   EXCEL
========================= */

function excelLoader(name){
    return `
    <div class="mb-4">
        <label class="block font-semibold">${name}</label>
        <input type="file" accept=".xlsx,.xls"
        onchange="importExcel(event,'${name}')"
        class="border p-2 rounded w-full">
    </div>`;
}

function importExcel(e,name){

    const file=e.target.files[0];
    const reader=new FileReader();

    reader.onload=function(evt){
        const wb=XLSX.read(evt.target.result,{type:'binary'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{defval:""});

        if(name==="MATERIALES"){
            STATE.tables[name]=json.map(r=>normalizarFila(r));
        }else{
            STATE.tables[name]=json;
        }

        saveState();
        alert(name+" cargado correctamente: "+STATE.tables[name].length+" registros");
    };

    reader.readAsBinaryString(file);
}

/* =========================
   COTIZACION
========================= */

function renderCotizacion(){

    if(STATE.tables.MATERIALES.length===0){
        return `<p class="text-red-600 font-bold">
        No hay materiales cargados. Ir a CONFIGURACIÓN.
        </p>`;
    }

    return `
    <h2 class="text-xl font-bold mb-4">Cotización</h2>

    <div class="flex gap-2 mb-4">
        <select id="matSel" class="border p-2 rounded w-full">
            ${STATE.tables.MATERIALES.map((m,i)=>
                `<option value="${i}">
                ${m.codigo||""} - ${m.descripcion||""}
                </option>`
            ).join("")}
        </select>

        <input id="cant" type="number" placeholder="Cant"
        class="border p-2 rounded w-24">

        <button onclick="agregar()" 
        class="bg-slate-800 text-white px-4 rounded">
        Agregar
        </button>
    </div>

    <table class="w-full bg-white text-sm">
        <thead class="bg-slate-200">
            <tr>
                <th>Codigo</th>
                <th>Descripcion</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
        ${STATE.cotizacion.map(i=>`
            <tr>
                <td>${i.codigo}</td>
                <td>${i.descripcion}</td>
                <td>${i.precio}</td>
                <td>${i.cantidad}</td>
                <td>${i.total}</td>
            </tr>
        `).join("")}
        </tbody>
    </table>

    <div class="text-right mt-4 font-bold">
        TOTAL: ${calcularTotal()}
    </div>
    `;
}

function agregar(){

    const index=document.getElementById("matSel").value;
    const cant=parseFloat(document.getElementById("cant").value)||0;

    const m=STATE.tables.MATERIALES[index];

    const precio=parseFloat(m.precio_un)||0;

    STATE.cotizacion.push({
        codigo:m.codigo||"",
        descripcion:m.descripcion||"",
        precio:precio,
        cantidad:cant,
        total:(precio*cant).toFixed(2)
    });

    saveState();

    document.querySelector(".content-area").innerHTML=
        renderCotizacion();
}

function calcularTotal(){
    return STATE.cotizacion
    .reduce((s,i)=>s+parseFloat(i.total),0)
    .toFixed(2);
}

/* =========================
   DRAG
========================= */

function makeDraggable(el){
    const header=el.querySelector(".cursor-move");
    let x=0,y=0;

    header.onmousedown=function(e){
        x=e.clientX-el.offsetLeft;
        y=e.clientY-el.offsetTop;

        document.onmousemove=function(e){
            el.style.left=(e.clientX-x)+"px";
            el.style.top=(e.clientY-y)+"px";
        }

        document.onmouseup=function(){
            document.onmousemove=null;
        }
    }
}

</script>
</body>
</html>
