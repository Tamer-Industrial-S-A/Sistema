<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMER INDUSTRIAL - ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <!-- Polyfill para Import Maps en navegadores antiguos -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.0"
  }
}
</script>
<style>
    /* Estilo para el loader inicial */
    #initial-loader {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
    }
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.1);
        border-left-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="initial-loader">
        <div class="spinner"></div>
        <p style="color: white; font-family: sans-serif; font-size: 10px; margin-top: 15px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;">Iniciando Tamer ERP</p>
    </div>
    
    <div id="root"></div>

    <script>
        // Ocultar loader cuando React tome el control
        window.addEventListener('load', () => {
            const observer = new MutationObserver(() => {
                if (document.getElementById('root').children.length > 0) {
                    document.getElementById('initial-loader').style.opacity = '0';
                    setTimeout(() => document.getElementById('initial-loader').remove(), 500);
                    observer.disconnect();
                }
            });
            observer.observe(document.getElementById('root'), { childList: true });
            
            // Si después de 5 segundos no hay contenido, puede ser un error de MIME o JS
            setTimeout(() => {
                if (document.getElementById('root').children.length === 0) {
                    console.error("Error: La aplicación no montó en el tiempo esperado.");
                }
            }, 5000);
        });
    </script>
</body>
</html>
