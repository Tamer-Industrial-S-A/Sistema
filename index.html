<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMER INDUSTRIAL ERP</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{overflow:hidden}
.window{position:absolute}
.titlebar{cursor:move}
</style>
</head>

<body class="bg-slate-900 text-white">

<div id="desktop" class="w-screen h-screen relative"></div>

<div class="absolute bottom-0 left-0 right-0 bg-slate-800 h-12 flex items-center px-4 gap-4">
<button onclick="openWindow('AUTOMATIZACION')" class="bg-slate-700 px-3 py-1 rounded">AUTOMATIZACION</button>
<button onclick="openWindow('CONFIGURACION')" class="bg-slate-700 px-3 py-1 rounded">CONFIGURACION</button>
</div>

<script>

/* =========================
   ESTADO GLOBAL
========================= */

const STATE={
MATERIALES:{headers:[],rows:[],visible:[]},
CLIENTES:{headers:[],rows:[],visible:[]},
ORD_FABRICACIONES:{headers:[],rows:[],visible:[]},
ORD_TRABAJOS:{headers:[],rows:[],visible:[]}
};

function saveState(){
localStorage.setItem("ERP_STATE",JSON.stringify(STATE));
}

function loadState(){
const data=localStorage.getItem("ERP_STATE");
if(data) Object.assign(STATE,JSON.parse(data));
}
loadState();

/* =========================
   VENTANAS
========================= */

let zIndex=10;

function openWindow(title){

const win=document.createElement("div");
win.className="window bg-white text-black rounded-2xl shadow-xl w-[1000px] h-[650px] p-4";
win.style.top="60px";
win.style.left="150px";
win.style.zIndex=zIndex++;

win.innerHTML=`
<div class="titlebar bg-slate-200 p-2 rounded-t-xl flex justify-between items-center">
<span class="font-bold">${title}</span>
<button onclick="this.closest('.window').remove()" class="text-red-600 font-bold">X</button>
</div>
<div class="content h-[580px] overflow-auto p-2"></div>
`;

document.getElementById("desktop").appendChild(win);
makeDraggable(win);
renderContent(title,win.querySelector(".content"));
}

function makeDraggable(el){
const bar=el.querySelector(".titlebar");
bar.onmousedown=e=>{
const ox=e.clientX-el.offsetLeft;
const oy=e.clientY-el.offsetTop;
document.onmousemove=e=>{
el.style.left=(e.clientX-ox)+"px";
el.style.top=(e.clientY-oy)+"px";
};
document.onmouseup=()=>document.onmousemove=null;
};
}

/* =========================
   RENDER
========================= */

function renderContent(title,container){

if(title==="CONFIGURACION"){
container.innerHTML=`
<h2 class="text-lg font-bold mb-3">Importar Excel</h2>

${Object.keys(STATE).map(t=>`
<button onclick="importExcel('${t}')" 
class="bg-blue-600 text-white px-3 py-1 rounded m-1">
Importar ${t}
</button>
`).join("")}

<hr class="my-4">

${renderTables()}
`;
}

if(title==="AUTOMATIZACION"){
renderCotizador(container);
}
}

/* =========================
   TABLAS
========================= */

function renderTables(){
return Object.keys(STATE).map(tabla=>{
if(STATE[tabla].rows.length===0)
return `<h3 class="mt-4 font-bold">${tabla} (sin datos)</h3>`;

const headers=STATE[tabla].visible.length>0 ? STATE[tabla].visible : STATE[tabla].headers;

return `
<h3 class="mt-4 font-bold">${tabla}</h3>
<table class="w-full text-xs border mb-6">
<tr>
${headers.map(h=>`<th class="border p-1 bg-gray-100">${h}</th>`).join("")}
</tr>
${STATE[tabla].rows.map(r=>`
<tr>
${headers.map(h=>`<td class="border p-1">${r[h]||""}</td>`).join("")}
</tr>
`).join("")}
</table>
`;
}).join("");
}

/* =========================
   IMPORTADOR
========================= */

function importExcel(tabla){

const input=document.createElement("input");
input.type="file";
input.accept=".xlsx,.xls";

input.onchange=e=>{
const file=e.target.files[0];
const reader=new FileReader();

reader.onload=evt=>{

const data=new Uint8Array(evt.target.result);
const wb=XLSX.read(data,{type:"array"});
const sheet=wb.Sheets[wb.SheetNames[0]];

const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});

if(rows.length===0){
alert("Archivo vacío");
return;
}

let headerIndex=rows.findIndex(r=>r.filter(c=>c!=="").length>=2);
if(headerIndex===-1){
alert("No se detectaron encabezados");
return;
}

const headers=rows[headerIndex].map(h=>h.toString().trim());

const dataRows=rows.slice(headerIndex+1)
.filter(r=>r.some(c=>c!==""))
.map(r=>{
let obj={};
headers.forEach((h,i)=>obj[h]=r[i]||"");
return obj;
});

STATE[tabla].headers=headers;
STATE[tabla].rows=dataRows;
STATE[tabla].visible=[...headers];

saveState();

mostrarSelectorCampos(tabla);

};

reader.readAsArrayBuffer(file);
};

input.click();
}

/* =========================
   CHECKLIST CAMPOS
========================= */

function mostrarSelectorCampos(tabla){

const modal=document.createElement("div");
modal.className="fixed inset-0 bg-black/60 flex items-center justify-center";

modal.innerHTML=`
<div class="bg-white p-6 rounded-2xl w-[500px] text-black">
<h2 class="font-bold mb-3">Seleccionar campos visibles (${tabla})</h2>

<div class="space-y-2 max-h-[300px] overflow-auto">
${STATE[tabla].headers.map(h=>`
<label class="flex items-center gap-2">
<input type="checkbox" value="${h}" checked>
<span>${h}</span>
</label>
`).join("")}
</div>

<div class="flex justify-end gap-2 mt-4">
<button onclick="this.closest('.fixed').remove()" 
class="bg-gray-400 px-3 py-1 rounded">Cancelar</button>

<button onclick="guardarCampos('${tabla}')" 
class="bg-green-600 text-white px-3 py-1 rounded">
Guardar
</button>
</div>
</div>
`;

document.body.appendChild(modal);
}

function guardarCampos(tabla){

const modal=document.querySelector(".fixed");
const checks=modal.querySelectorAll("input[type='checkbox']:checked");

STATE[tabla].visible=[...checks].map(c=>c.value);

saveState();
modal.remove();
alert("Campos actualizados");
}

/* =========================
   COTIZADOR
========================= */

let cotizacion=[];

function renderCotizador(container){

if(STATE.MATERIALES.rows.length===0){
container.innerHTML="<h2>No hay materiales cargados</h2>";
return;
}

const headers=STATE.MATERIALES.visible.length>0 ? 
STATE.MATERIALES.visible : STATE.MATERIALES.headers;

container.innerHTML=`
<h2 class="text-lg font-bold mb-3">Cotización</h2>

<select id="matSelect" class="border p-1 mb-2">
${STATE.MATERIALES.rows.map((m,i)=>`
<option value="${i}">
${headers.map(h=>m[h]).join(" - ")}
</option>
`).join("")}
</select>

<input id="cantidad" type="number" value="1" class="border p-1 w-20">

<button onclick="agregarItem()" 
class="bg-green-600 text-white px-3 py-1 rounded ml-2">
Agregar
</button>

<table class="w-full text-xs border mt-4">
<thead>
<tr>
${headers.map(h=>`<th class="border p-1 bg-gray-100">${h}</th>`).join("")}
<th class="border p-1 bg-gray-100">CANT</th>
<th class="border p-1 bg-gray-100">TOTAL</th>
</tr>
</thead>
<tbody id="cotBody"></tbody>
</table>

<h3 class="mt-3 font-bold">TOTAL: $<span id="total">0</span></h3>
`;
}

function agregarItem(){
const index=document.getElementById("matSelect").value;
const cant=parseFloat(document.getElementById("cantidad").value);

const mat=STATE.MATERIALES.rows[index];

let precio=0;
Object.values(mat).forEach(v=>{
if(!isNaN(parseFloat(v)) && precio===0)
precio=parseFloat(v);
});

const total=precio*cant;

cotizacion.push({mat,cant,total});
renderCotizacion();
}

function renderCotizacion(){
const body=document.getElementById("cotBody");
body.innerHTML="";
let suma=0;

cotizacion.forEach(i=>{
suma+=i.total;
body.innerHTML+=`
<tr>
${Object.values(i.mat).map(v=>`<td class="border p-1">${v}</td>`).join("")}
<td class="border p-1">${i.cant}</td>
<td class="border p-1">${i.total.toFixed(2)}</td>
</tr>
`;
});

document.getElementById("total").innerText=suma.toFixed(2);
}

</script>
</body>
</html>
