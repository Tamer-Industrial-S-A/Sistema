
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial ERP - TAMER INDUSTRIAL S.A.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script>
        // Polyfill robusto para entorno de navegador
        window.process = { 
            env: { NODE_ENV: 'production' },
            nextTick: (cb) => setTimeout(cb, 0)
        };
        window.global = window;

        // Función para mostrar errores críticos en pantalla
        function showError(title, msg, file) {
            const root = document.getElementById('root');
            if (root) {
                root.style.display = 'block';
                root.style.background = '#0f172a';
                root.innerHTML = `
                    <div style="background: #1e293b; color: #f87171; padding: 30px; font-family: system-ui; border-radius: 15px; margin: 20px; border: 1px solid #ef4444; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);">
                        <h2 style="margin:0 0 10px 0; color: white; display: flex; items-center: center; gap: 10px;">⚠️ ${title}</h2>
                        <p style="font-size: 14px; margin:0; color: #94a3b8;">El sistema no pudo arrancar debido a un error técnico:</p>
                        <div style="background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 15px; font-family: monospace; font-size: 12px; overflow-x: auto; border: 1px solid #334155; color: #fca5a5;">
                            <strong>Error:</strong> ${msg}<br>
                            <small style="color: #64748b;">Archivo: ${file || 'Módulo Principal'}</small>
                        </div>
                        <button onclick="location.reload()" style="margin-top: 20px; background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;">Reintentar Cargar Sistema</button>
                    </div>
                `;
            }
        }

        window.addEventListener('error', function(e) {
            showError("Error de Ejecución", e.message, e.filename);
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
            showError("Error de Promesa", e.reason, "Async/Await");
        });
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "recharts": "https://esm.sh/recharts@3.0.0",
    "@google/genai": "https://esm.sh/@google/genai@0.2.1",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.46.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<style>
    body { margin: 0; background-color: #0f172a; height: 100vh; width: 100vw; overflow: hidden; }
    #root { height: 100%; width: 100%; }
    
    /* Estado de carga visible solo cuando el div está vacío */
    #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 24px;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }
    #root:empty::before {
        content: "";
        width: 48px;
        height: 48px;
        border: 4px solid #1d4ed8;
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    #root:empty::after {
        content: "SISTEMA TAMER - CARGANDO MÓDULOS";
        font-weight: 900;
        letter-spacing: 0.25em;
        font-size: 0.65rem;
        color: #94a3b8;
        text-transform: uppercase;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-900">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
